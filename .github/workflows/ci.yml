name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  daemon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet (linux and windows)
        run: go vet ./... && GOOS=windows go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: build windows
        run: GOOS=windows GOARCH=amd64 go build ./... && GOOS=windows GOARCH=arm64 go build ./...

  daemon-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
      - run: go test -count=1 ./...

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon test assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: korokmote-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
      - run: sudo apt-get update && sudo apt-get install -y nsis zip
      - run: ./build.sh ci-${GITHUB_SHA::7}
      - uses: actions/upload-artifact@v4
        with:
          name: korokmote-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
